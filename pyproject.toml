[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safety-red-teaming"
version = "0.1.0"
description = "Offline, deterministic AI safety red-teaming toolkit: attack prompt generation, refusal and unsafe-content analysis, attack success rate and refusal-consistency scoring."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sherif Olabode" }]
keywords = ["ai-safety", "red-teaming", "llm", "evaluation", "adversarial", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
redteam = "ai_safety_red_teaming.cli:main"

[project.urls]
Homepage = "https://github.com/Sharif899/ai-safety-red-teaming"
Repository = "https://github.com/Sharif899/ai-safety-red-teaming"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
